<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Brew Café</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<header id="mainHeader">

<h1>Dream Brew Café</h1>

<nav>
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#">Order</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<figure>

<img src="cafe.jpg" alt="Cafe Image">

<figcaption>
Our Signature Burger & Coffee
</figcaption>

</figure>

</section>

<section>

<h2>Café Ambience Music</h2>

<audio controls>

<source src="ambience.mp3" type="audio/mp3">

Your browser does not support audio.

</audio>

</section>

<section>

<h2>Our Café Video</h2>

<video controls width="500">

<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">

Your browser does not support video.

</video>

</section>

<hr>

<section>

<h2>Place Your Order</h2>

<form>

<label class="formLabel">Name</label>

<input type="text" placeholder="Enter your Name">

<label class="formLabel">Email</label>

<input type="email" placeholder="Enter Email">

<label class="formLabel">Phone Number</label>

<input type="tel" placeholder="9876543210">

<label class="formLabel">Quantity</label>

<input type="number" min="1" max="10">

<label class="formLabel">Pickup Time</label>

<input type="time">

<label class="formLabel">Pickup Date</label>

<input type="date">

<label class="formLabel">Spice Level</label>

<input type="range">

<label class="formLabel">Favorite Topping</label>

<input type="radio" name="topping"> Cheese

<input type="radio" name="topping"> Corn

<input type="radio" name="topping"> Mushroom

<br><br>

<label class="formLabel">Extras</label>

<input type="checkbox"> Sprinkles

<input type="checkbox"> Whipped Cream

<br><br>

<label class="formLabel">Cup Color</label>

<input type="color">

<br><br>

<label class="formLabel">Special Instructions</label>

<textarea rows="5"></textarea>

<br>

<button type="submit" class="orderBtn">

Order Now

</button>

</form>

</section>

<hr>

<section>

<h2>Today's Menu</h2>

<div class="menu">

Coffee ☕

Espresso ☕

Cold Coffee 🥤

Pizza 🍕

Burger 🍔

French Fries 🍟

Chocolate Cake 🍰

Sandwich 🥪

</div>

</section>

</body>

</html>
